name: PC Virtual StarDesk

on:
  workflow_dispatch:
    inputs:
      rodada:
        description: "Rodada atual (não mexa)"
        default: "1"
      max_rodadas:
        description: "Quantas rodadas de ~340 min (11 = ~3.600 min)"
        default: "11"

permissions:
  actions: write   # deixa a rodada chamar a próxima sozinha
  contents: read

jobs:
  pc:
    runs-on: windows-2022   # o mais próximo de Windows 10 no GitHub
    timeout-minutes: 360    # limite máximo de um job

    steps:
      # 1) Ativa o Escritório Remoto e cria o usuário (login do app do Windows)
      - name: Ativar acesso remoto
        shell: pwsh
        run: |
          $senha = (-join ((48..57)+(65..90)+(97..122) | Get-Random -Count 16 | % {[char]$_})) + "Aa1!"
          net user Skyro $senha /add
          net localgroup Administrators Skyro /add
          net localgroup "Remote Desktop Users" Skyro /add
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Write-Host "=============================="
          Write-Host "USUARIO: Skyro"
          Write-Host "SENHA:   $senha"
          Write-Host "=============================="

      # 2) Tailscale: mostra no log o LINK para você clicar e logar
      - name: Tailscale (link de login)
        shell: pwsh
        run: |
          $msi = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          Start-Process $ts -ArgumentList "up","--unattended","--hostname=pc-virtual-r${{ inputs.rodada }}" `
            -RedirectStandardError "$PWD\ts.err" -RedirectStandardOutput "$PWD\ts.out" -NoNewWindow
          $link = $null
          for ($i=0; $i -lt 60 -and -not $link; $i++) {
            Start-Sleep 2
            $txt = (Get-Content "$PWD\ts.err","$PWD\ts.out" -ErrorAction SilentlyContinue) -join "`n"
            if ($txt -match "https://login\.tailscale\.com/\S+") { $link = $Matches[0] }
          }
          Write-Host "=============================="
          Write-Host "LINK DE LOGIN TAILSCALE: $link"
          Write-Host "=============================="
          # espera você logar (até 10 min) e mostra o IP
          for ($i=0; $i -lt 120; $i++) {
            $ip = & $ts ip -4 2>$null
            if ($ip) { Write-Host "IP TAILSCALE (use no Escritório Remoto): $ip"; break }
            Start-Sleep 5
          }

      # 3) Instala o StarDesk (instalador oficial, modo silencioso)
      - name: Instalar StarDesk
        shell: pwsh
        run: |
          $url = "https://dl.stardesk.net/StarDesk_Setup_1.0.4.5925_1127231252_webcoop.exe"
          $exe = "$env:TEMP\stardesk-setup.exe"
          Invoke-WebRequest $url -OutFile $exe
          Start-Process $exe -ArgumentList "/S" -Wait   # /S = silencioso
          Write-Host "StarDesk instalado. Abra-o dentro do PC e entre com o Google."

      # 4) Mantém o PC ligado e chama a próxima rodada
      - name: Manter ligado e encadear
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $fim = (Get-Date).AddMinutes(325)
          while ((Get-Date) -lt $fim) { Start-Sleep 60 }
          $atual = [int]"${{ inputs.rodada }}"
          $max   = [int]"${{ inputs.max_rodadas }}"
          if ($atual -lt $max) {
            gh workflow run stardesk.yml --repo ${{ github.repository }} --ref ${{ github.ref_name }} -f rodada=($atual+1) -f max_rodadas=$max
          }
